spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

server.port=${SERVER_PORT:8082}
spring.application.name=Yomu

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yomu_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Kebonpala_24}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.baseline-on-migrate=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

management.metrics.tags.service.name=${OTEL_SERVICE_NAME:be-achievement}
management.metrics.tags.service.namespace=${OTEL_SERVICE_NAMESPACE:yomu}
management.metrics.tags.deployment.environment=${OTEL_DEPLOYMENT_ENVIRONMENT:local}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORTER_ENABLED:true}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=${OTEL_METRICS_EXPORT_STEP:10s}
